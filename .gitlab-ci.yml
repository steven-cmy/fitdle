workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - check
  - build
  - image
  - deploy

default:
  image: node:24-bookworm-slim
  interruptible: true

# Runs on default-branch pipelines, MRs and manual/web runs. It compares the
# SDE API release/build number with the deployed Pages manifest and exports
# SDE_CHANGED for the build job.
sde:check:
  stage: check
  script:
    - node scripts/check-sde.mjs
  artifacts:
    reports:
      dotenv: .cache/sde-check.env
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Default-branch pushes and manual/web runs rebuild/deploy. The daily target no
# longer depends on a daily pipeline. Rebuild the normalized SDE from the cached
# SDE API tables on every build so code/data schema changes cannot be masked by
# an older normalized cache.
build:
  stage: build
  needs:
    - job: sde:check
      artifacts: true
  cache:
    key: fitdle-build-v6
    paths:
      - .cache/normalized.json
      - .cache/killpool.json
      - .cache/sde-meta.json
      - .cache/ship-usage.json
      - .cache/zkill-version.json
  script:
    # Compare with the cached release instead of the deployed Pages manifest,
    # which is not readable when Pages access is restricted.
    - |
      if [ "${FORCE_SDE:-0}" = "1" ] || [ "${FORCE_SDE:-0}" = "true" ] || [ "$(node -p 'require("./.cache/normalized.json").normalizedVersion || 0' 2>/dev/null)" != "3" ] || ! node scripts/build-cache.mjs --release "$SDE_RELEASE"; then
        npm run prepare:sde -- --refresh
      fi
    # Monthly hull usage kept on the data branch; the build goes on without it.
    - npm run fetch:usage
    - |
      if [ ! -f data/catalog.json ]; then
        npm run build:catalog
      fi
    # One request; keep the cached pool when zKill is unavailable.
    - npm run build:killpool || grep -q '"serverDate"' .cache/killpool.json
    - npm run build
    - npm test
    - npm ci --prefix server --no-audit --no-fund
    - npm run test:server
  artifacts:
    paths:
      - dist
      # Reused by image:publish so the image does not request the data again.
      - .cache/normalized.json
      - .cache/killpool.json
      - .cache/sde-meta.json
      - .cache/ship-usage.json
      - .cache/zkill-version.json
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

image:publish:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs:
    - job: build
      artifacts: true
  timeout: 2h
  interruptible: false
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"username":"$CI_REGISTRY_USER","password":"$CI_REGISTRY_PASSWORD"}}}
      EOF
  script:
    - |
      VERSION="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -n1)"
      test -n "$VERSION"
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$CI_REGISTRY_IMAGE:$VERSION" \
        --destination "$CI_REGISTRY_IMAGE:v$VERSION" \
        --destination "$CI_REGISTRY_IMAGE:latest" \
        --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
        --build-arg "PUBLIC_ORIGIN=__FITDLE_PUBLIC_ORIGIN__" \
        --build-arg "REUSE_BUILD_CACHE=1" \
        --cache=true \
        --cache-repo="$CI_REGISTRY_IMAGE/cache" \
        --cache-ttl=168h \
        --label "org.opencontainers.image.version=$VERSION" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --verbosity=info
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# On a new main version, publish a tagged release. GitLab provides the source archives.
release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build
      artifacts: false
    - job: image:publish
      artifacts: false
  script:
    - |
      VERSION="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -n1)"
      test -n "$VERSION"
      NOTES="$(awk -v section="## v$VERSION" '$0 == section {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md)"
      test -n "$NOTES"
      echo "$NOTES"
      release-cli create --name "FITDLE v$VERSION" --tag-name "v$VERSION" --description "$NOTES" --ref "$CI_COMMIT_SHA"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - package.json

pages:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  script:
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
