workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - check
  - build
  - deploy

default:
  image: node:24-bookworm
  interruptible: true

# Runs on default-branch pipelines, MRs and manual/web runs. It compares the
# SDE API release/build number with the deployed Pages manifest and exports
# SDE_CHANGED for the build job.
sde:check:
  stage: check
  script:
    - node scripts/check-sde.mjs
  artifacts:
    reports:
      dotenv: .cache/sde-check.env
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Default-branch pushes and manual/web runs rebuild/deploy. The daily target no
# longer depends on a daily pipeline. Rebuild the normalized SDE from the cached
# SDE API tables on every build so code/data schema changes cannot be masked by
# an older normalized cache.
build:
  stage: build
  needs:
    - job: sde:check
      artifacts: true
  cache:
    key: fitdle-build-v6
    paths:
      - .cache/normalized.json
      - .cache/killpool.json
      - .cache/sde-meta.json
      - .cache/ship-weights.json
  script:
    - |
      if [ "$SDE_CHANGED" = "1" ] || [ ! -f .cache/normalized.json ] || [ "$(node -p 'require("./.cache/normalized.json").normalizedVersion || 0' 2>/dev/null)" != "3" ]; then
        if [ "$SDE_CHANGED" = "1" ]; then
          npm run prepare:sde -- --refresh
        else
          npm run prepare:sde
        fi
      fi
    - |
      if [ ! -f data/catalog.json ]; then
        npm run build
      fi
    - |
      if [ "$SDE_CHANGED" = "1" ] || [ ! -f .cache/killpool.json ] || ! grep -q '"serverDate"' .cache/killpool.json; then
        npm run build:killpool
      fi
    - |
      if [ "$SDE_CHANGED" = "1" ] || [ ! -f .cache/ship-weights.json ]; then
        npm run build:weights
      fi
    - npm run build
    - npm test
    - npm ci --prefix server --no-audit --no-fund
    - npm run test:server
  artifacts:
    paths:
      - dist
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# On a new main version, publish a tagged release. GitLab provides the source archives.
release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build
      artifacts: false
  script:
    - |
      VERSION="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -n1)"
      test -n "$VERSION"
      NOTES="$(awk -v section="## v$VERSION" '$0 == section {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md)"
      test -n "$NOTES"
      echo "$NOTES"
      release-cli create --name "FITDLE v$VERSION" --tag-name "v$VERSION" --description "$NOTES" --ref "$CI_COMMIT_SHA"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - package.json

pages:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  script:
    - rm -rf public
    - cp -r dist public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
