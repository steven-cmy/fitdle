stages:
  - check
  - build
  - deploy

default:
  image: node:20-bookworm
  interruptible: true

# Runs on every default-branch pipeline and on the daily schedule.
# It compares the SDE ETag/Last-Modified header with the currently deployed
# Pages manifest and exports SDE_CHANGED for the build job.
sde:check:
  stage: check
  script:
    - node scripts/check-sde.mjs
  artifacts:
    reports:
      dotenv: .cache/sde-check.env
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Every default-branch push and every scheduled run rebuilds/deploys. The SDE
# refresh itself is skipped unless sde:check detected a new release.
build:
  stage: build
  needs:
    - job: sde:check
      artifacts: true
  cache:
    key: fitdle-build-v3
    paths:
      - .cache/normalized.json
      - .cache/killpool.json
      - .cache/sde-meta.json
      - .cache/ship-weights.json
  script:
    - |
      if [ "$SDE_CHANGED" = "1" ] || [ ! -f .cache/normalized.json ]; then
        npm run prepare:sde -- --refresh
      fi
    - |
      if [ ! -f data/catalog.json ]; then
        npm run build
      fi
    - |
      if [ "$SDE_CHANGED" = "1" ] || [ ! -f .cache/killpool.json ] || ! grep -q '"serverDate"' .cache/killpool.json; then
        npm run build:killpool
      fi
    - |
      if [ "$SDE_CHANGED" = "1" ] || [ ! -f .cache/ship-weights.json ]; then
        npm run build:weights -- --refresh
      fi
    - npm run build
    - npm test
    - VERSION="$(node -p "require('./package.json').version")"
    - ARCHIVE="fitdle-v${VERSION}-source.tar.gz"
    - echo "VERSION=$VERSION" > release.env
    - echo "ARCHIVE=$ARCHIVE" >> release.env
    - git archive --format=tar.gz --prefix="fitdle-v${VERSION}/" -o "$ARCHIVE" HEAD
    - test -s "$ARCHIVE"
  artifacts:
    paths:
      - dist
      - fitdle-v*-source.tar.gz
    reports:
      dotenv: release.env
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# On a new main version, publish a tagged release with a source tarball.
release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build
      artifacts: true
  script:
    - test -s "$ARCHIVE"
    - mkdir -p release
    - cp "$ARCHIVE" release/
  artifacts:
    paths:
      - release/*.tar.gz
    expire_in: never
  release:
    tag_name: "v$VERSION"
    name: "FITDLE v$VERSION"
    description: "Source release for FITDLE v$VERSION."
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: "Source archive (tar.gz)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_SHA/raw/release/$ARCHIVE?job=release"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - package.json

pages:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  script:
    - rm -rf public
    - cp -r dist public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
