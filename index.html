    try {
      if (localStorage.getItem('fitdle:v1:font') === 'classic') {
        document.documentElement.dataset.eveFont = 'classic';

  </script>

<body>
  <div id="app">
    <div class="boot-screen" role="status" aria-live="polite">
      <div class="boot-mark" aria-hidden="true">
        <span class="boot-ring boot-ring-a"></span>
        <span class="boot-ring boot-ring-b"></span>
        <span class="boot-cross boot-cross-x"></span>
        <span class="boot-cross boot-cross-y"></span>
        <span class="boot-core"></span>
      </div>
      <div class="boot-title">F.I.T.D.L.E.</div>
      <div class="boot-fullname">Fitting Identification, Testimony &amp; Damage Ledger Evaluation</div>
      <div class="boot-logos" data-boot-logos aria-label="Pend Insurance and Secure Commerce Commission">
        <span class="brand-emblem boot-logo">
          <span class="brand-emblem-fallback" aria-hidden="true">PI</span>
          <img src="__IMAGE_BASE__/corporations/1000113/logo?size=128" alt="Pend Insurance" referrerpolicy="no-referrer" onerror="this.remove()">
        </span>
        <span class="boot-logo-divider" aria-hidden="true">//</span>
        <span class="brand-emblem boot-logo">
          <span class="brand-emblem-fallback" aria-hidden="true">SCC</span>
          <img src="__IMAGE_BASE__/corporations/1000132/logo?size=128" alt="Secure Commerce Commission" referrerpolicy="no-referrer" onerror="this.remove()">
        </span>
      </div>
      <div class="boot-status">VERIFYING ASSESSOR</div>
      <div class="boot-sub">Opening Pend Insurance claims terminal</div>
      <div class="boot-bar"><span></span></div>
    </div>
  </div>

  <script>
    (function () {
      const copy = {
        en: ['VERIFYING ASSESSOR', 'Opening Pend Insurance claims terminal'],
        de: ['SACHBEARBEITER WIRD GEPRÜFT', 'Pend-Insurance-Schadensterminal wird geöffnet'],
        es: ['VERIFICANDO PERITO', 'Abriendo terminal de siniestros de Pend Insurance'],
        fr: ['VÉRIFICATION DE L’EXPERT', 'Ouverture du terminal sinistres Pend Insurance'],
        ja: ['査定担当者を確認中', 'ペンド保険クレーム端末を起動中'],
        ko: ['손해사정 담당자 확인 중', '펜드 보험 클레임 단말 여는 중'],
        ru: ['ПРОВЕРКА ОЦЕНЩИКА', 'Открытие терминала убытков Pend Insurance'],
        zh: ['正在验证评估员', '正在打开彭德保险理赔终端'],
      };
      const supported = Object.keys(copy);
      const normalize = (value) => {
        const raw = String(value || '').toLowerCase();
        if (/^zh([-_]|$)/.test(raw)) return 'zh';
        const base = raw.split(/[-_]/)[0];
        return supported.includes(base) ? base : null;
      };
      let locale = null;
      try {
        locale = normalize(localStorage.getItem('fitdle:v1:lang'));
      } catch {}
      if (!locale && navigator.languages) {
        for (const candidate of navigator.languages) {
          locale = normalize(candidate);
          if (locale) break;
        }
      }
      locale = locale || normalize(navigator.language) || 'en';
      const text = copy[locale];
      document.documentElement.lang = locale;
      const status = document.querySelector('.boot-status');
      const sub = document.querySelector('.boot-sub');
      if (status) status.textContent = text[0];
      if (sub) sub.textContent = text[1];
    })();
  </script>

  <div id="suggestions" class="suggestions" role="listbox" hidden></div>
  <div id="modal-root" class="modal-root" aria-hidden="true"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite" aria-atomic="false"></div>
  <div id="new-clue-hint" class="new-clue-hint" aria-live="polite" hidden></div>

  <noscript>
    <div class="noscript-panel">
      <h1>FITDLE</h1>
      <p>This claims terminal requires JavaScript. Enable JavaScript in your browser to reach Pend Insurance loss intake.</p>
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
