<!doctype html>
<html lang="en" data-eve-font="neue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05080c">
  <meta name="color-scheme" content="dark">
  <title>FITDLE — Daily EVE Online Killboard Puzzle</title>
  <meta name="description" content="Read the fittings. Name the hull. A daily EVE Online killboard puzzle with six attempts, one target per UTC day, and eight client languages.">
  <meta property="og:site_name" content="FITDLE">
  <meta property="og:title" content="FITDLE — Daily EVE Online Killboard Puzzle">
  <meta property="og:description" content="Read the fittings. Name the hull. Six attempts, one target per UTC day, eight languages. Can you read the killboard?">
  <meta property="og:type" content="website">
  <meta property="og:url" content="__SITE_URL__/">
  <meta property="og:image" content="__SITE_URL__/assets/share/og.png">
  <meta property="og:image:secure_url" content="__SITE_URL__/assets/share/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="FITDLE daily EVE Online killboard puzzle">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FITDLE — Daily EVE Online Killboard Puzzle">
  <meta name="twitter:description" content="Read the fittings. Name the hull. Six attempts, one target per UTC day, eight languages.">
  <meta name="twitter:image" content="__SITE_URL__/assets/share/og.png">
  <meta name="twitter:image:alt" content="FITDLE daily EVE Online killboard puzzle">
  <meta name="application-name" content="FITDLE">
  <link rel="canonical" href="__SITE_URL__/">
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <script>
    try {
      if (localStorage.getItem('fitdle:v1:font') === 'classic') {
        document.documentElement.dataset.eveFont = 'classic';
      }
      const params = new URLSearchParams(location.search);
      if (params.get('rule') === 'abyss' || (!params.get('rule') && params.get('mode') === 'abyss')) {
        document.documentElement.dataset.gameMode = 'abyss';
        const theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.setAttribute('content', '#070203');
      }
      if (params.get('timer') === '1' || params.get('timed') === '1') {
        document.documentElement.dataset.timed = '1';
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="atmosphere" aria-hidden="true"></div>

  <div id="app">
    <div class="boot-screen" role="status" aria-live="polite">
      <div class="boot-mark" aria-hidden="true">
        <span class="boot-ring boot-ring-a"></span>
        <span class="boot-ring boot-ring-b"></span>
        <span class="boot-cross boot-cross-x"></span>
        <span class="boot-cross boot-cross-y"></span>
        <span class="boot-core"></span>
      </div>
      <div class="boot-title">FITDLE</div>
      <div class="boot-status">ESTABLISHING UPLINK</div>
      <div class="boot-sub">Decrypting daily intelligence package</div>
      <div class="boot-bar"><span></span></div>
    </div>
  </div>

  <script>
    (function () {
      const copy = {
        en: ['SCANNING FOR SHIP SIGNALS', 'Resolving killboard telemetry'],
        de: ['SCHIFFSSIGNALE WERDEN GESUCHT', 'Killboard-Telemetrie wird aufgelöst'],
        es: ['ESCANEANDO SEÑALES DE NAVES', 'Resolviendo telemetría del killboard'],
        fr: ['SCAN DES SIGNAUX DE VAISSEAUX', 'Résolution de la télémétrie killboard'],
        ja: ['艦船信号をスキャン中', 'キルボード遠隔測定を解析中'],
        ko: ['함선 신호 스캔 중', '킬보드 원격 측정 분석 중'],
        ru: ['СКАНИРОВАНИЕ СИГНАЛОВ КОРАБЛЕЙ', 'Обработка телеметрии киллборда'],
        zh: ['正在扫描舰船信号', '正在解析击杀板遥测'],
      };
      const supported = Object.keys(copy);
      const normalize = (value) => {
        const raw = String(value || '').toLowerCase();
        if (/^zh([-_]|$)/.test(raw)) return 'zh';
        const base = raw.split(/[-_]/)[0];
        return supported.includes(base) ? base : null;
      };
      let locale = null;
      try {
        locale = normalize(new URLSearchParams(location.search).get('lang'))
          || normalize(localStorage.getItem('fitdle:v1:lang'));
      } catch {}
      if (!locale && navigator.languages) {
        for (const candidate of navigator.languages) {
          locale = normalize(candidate);
          if (locale) break;
        }
      }
      locale = locale || normalize(navigator.language) || 'en';
      const text = copy[locale];
      document.documentElement.lang = locale;
      const status = document.querySelector('.boot-status');
      const sub = document.querySelector('.boot-sub');
      if (status) status.textContent = text[0];
      if (sub) sub.textContent = text[1];
    })();
  </script>

  <div id="suggestions" class="suggestions" role="listbox" hidden></div>
  <div id="modal-root" class="modal-root" aria-hidden="true"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite" aria-atomic="false"></div>
  <div id="new-clue-hint" class="new-clue-hint" aria-live="polite" hidden></div>

  <noscript>
    <div class="noscript-panel">
      <h1>FITDLE</h1>
      <p>This puzzle requires JavaScript. Enable JavaScript in your browser to establish the uplink.</p>
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
