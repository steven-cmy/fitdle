services:
  fitdle:
    image: registry.gitlab.com/cmy/fitdle:1.0.1
    env_file:
      - .env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - fitdle-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  fitdle-data:
