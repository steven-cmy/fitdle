name: CI

# Day-to-day work goes to dev, which does not trigger CI. A pull request into
# main checks, tests and builds the container image without pushing it
# (sde-check, build, release-check, image-check). After the PR is merged, the
# push to main deploys GitHub Pages and, for a package.json version without a
# GitHub Release, publishes the container image to GHCR and creates the Release.
# Manual runs publish only when started on main, and always push the image.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_sde:
        description: Download the SDE again even if the cached release matches
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Static practice build; also the share/OG origin for Pages.
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  # Compares the SDE API release with the deployed Pages manifest and passes
  # SDE_RELEASE to the build job.
  sde-check:
    runs-on: ubuntu-latest
    outputs:
      sde_release: ${{ steps.check.outputs.SDE_RELEASE }}
      sde_changed: ${{ steps.check.outputs.SDE_CHANGED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: check
        run: |
          node scripts/check-sde.mjs
          cat .cache/sde-check.env >> "$GITHUB_OUTPUT"

  # Rebuild the normalized SDE from the cached SDE API tables on every build so
  # code/data schema changes cannot be masked by an older normalized cache.
  build:
    runs-on: ubuntu-latest
    needs: sde-check
    env:
      SDE_RELEASE: ${{ needs.sde-check.outputs.sde_release }}
      FORCE_SDE: ${{ inputs.force_sde && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          # Caches are immutable on GitHub: save a new entry per run and restore
          # the newest one.
          key: fitdle-build-v6-${{ github.run_id }}
          restore-keys: fitdle-build-v6-
          path: |
            .cache/normalized.json
            .cache/killpool.json
            .cache/sde-meta.json
            .cache/ship-usage.json
            .cache/zkill-version.json
      - name: Prepare SDE
        run: |
          if [ "${FORCE_SDE:-0}" = "1" ] || [ "$(node -p 'require("./.cache/normalized.json").normalizedVersion || 0' 2>/dev/null)" != "3" ] || ! node scripts/build-cache.mjs --release "$SDE_RELEASE"; then
            npm run prepare:sde -- --refresh
          fi
      # Monthly hull usage kept on the data branch; the build goes on without it.
      - run: npm run fetch:usage
      - name: Build catalog
        run: |
          if [ ! -f data/catalog.json ]; then
            npm run build:catalog
          fi
      # One request; keep the cached pool when zKill is unavailable.
      - run: npm run build:killpool || grep -q '"serverDate"' .cache/killpool.json
      - run: npm run build
      - run: npm test
      - run: npm ci --prefix server --no-audit --no-fund
      - run: npm run test:server
      - name: Keep build output
        uses: actions/upload-artifact@v4
        with:
          name: build
          retention-days: 7
          include-hidden-files: true
          # dist for Pages; the data files are reused by the image so it does
          # not request the data again.
          path: |
            dist
            .cache/normalized.json
            .cache/killpool.json
            .cache/sde-meta.json
            .cache/ship-usage.json
            .cache/zkill-version.json

  # Pull requests only: when the program changes, the version must grow and
  # CHANGELOG.md must describe it. Documentation and .github changes pass as is.
  release-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-release.mjs "origin/${{ github.base_ref }}"

  # Pull requests only: build the image the way the publish job does and start it
  # once, so a broken Dockerfile shows up before the merge. Nothing is pushed.
  # The GitHub Actions cache written here is only visible to later runs of the
  # same pull request. The registry cache of the publish job is only read.
  image-check:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build without pushing
        uses: docker/build-push-action@v6
        with:
          # The checked-out folder with the downloaded build files. The default
          # context of this action is the Git repository, which lacks them.
          context: .
          file: Dockerfile
          push: false
          # Loaded into the runner's Docker for the start check.
          load: true
          tags: fitdle:check
          build-args: |
            PUBLIC_ORIGIN=__FITDLE_PUBLIC_ORIGIN__
            REUSE_BUILD_CACHE=1
            RUN_TESTS=0
          cache-from: |
            type=gha,scope=image-check
            type=registry,ref=${{ steps.name.outputs.image }}:buildcache
          cache-to: type=gha,scope=image-check,mode=max,ignore-error=true
      # The tests never run the runtime stage: start it and ask for the health
      # check and the front page.
      - name: Start the image
        run: |
          docker run --detach --name fitdle-check \
            --publish 127.0.0.1:8787:8787 \
            --env PUBLIC_ORIGIN=http://localhost:8787 \
            --env FITDLE_USAGE_REFRESH_HOURS=0 \
            fitdle:check
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8787/api/v1/health \
              && curl -fsS --max-time 5 --output /dev/null http://127.0.0.1:8787/; then
              echo
              docker logs fitdle-check
              exit 0
            fi
            [ "$(docker inspect --format '{{.State.Running}}' fitdle-check)" = "true" ] || break
            sleep 1
          done
          echo "::error::The image did not answer its health check and front page."
          docker logs fitdle-check
          exit 1

  image:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # An existing Release means this version is published, and a merge without
      # a new version must not overwrite its image tags. Without a Release (for
      # example after a failed publish) the image is pushed again. A manual run
      # always pushes.
      - name: Check whether this version is published
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test -n "$VERSION"
          PUSH=true
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            if RESULT="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" 2>&1)"; then
              PUSH=false
              echo "::notice::Release v$VERSION exists; image push skipped."
            elif ! grep -q 'HTTP 404' <<<"$RESULT"; then
              # Unknown state: fail rather than risk overwriting.
              echo "$RESULT"
              exit 1
            fi
          fi
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.published.outputs.push == 'true'
        with:
          name: build
      - uses: docker/setup-buildx-action@v3
        if: steps.published.outputs.push == 'true'
      - uses: docker/login-action@v3
        if: steps.published.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: steps.published.outputs.push == 'true'
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test -n "$VERSION"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::8}"
          docker buildx build . \
            --file Dockerfile \
            --push \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:v$VERSION" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$SHORT_SHA" \
            --build-arg "PUBLIC_ORIGIN=__FITDLE_PUBLIC_ORIGIN__" \
            --build-arg "REUSE_BUILD_CACHE=1" \
            --build-arg "RUN_TESTS=0" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

  # A new package.json version gets a GitHub Release whose notes are the
  # matching CHANGELOG.md section. Without a section the release is skipped.
  release:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test -n "$VERSION"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          NOTES="$(awk -v section="## v$VERSION" '$0 == section {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            echo "::warning::CHANGELOG.md has no ## v$VERSION section; release skipped."
            exit 0
          fi
          printf '%s\n' "$NOTES" > notes.md
          gh release create "v$VERSION" --title "FITDLE v$VERSION" --notes-file notes.md --target "$GITHUB_SHA"

  # Uploading and deploying are separate jobs: a deploy in the same job could
  # miss the artifact it had just uploaded, and re-running only the deploy must
  # not upload a second one.
  pages-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    runs-on: ubuntu-latest
    needs: pages-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The artifact list can lag behind the upload.
      - run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
