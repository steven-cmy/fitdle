name: Reset dev

# After a dev -> main pull request is merged, move dev to the merge result, but
# only while dev still points at the commit that was merged. Anything pushed to
# dev since then is left alone and reported on the pull request.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reset-dev
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Reset dev to the merged main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          comment() {
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$1"
          }
          CURRENT="$(git ls-remote origin refs/heads/dev | cut -f1)"
          if [ "$CURRENT" = "$MERGE_SHA" ]; then
            echo "dev already points at the merge commit."
            exit 0
          fi
          if [ -z "$CURRENT" ]; then
            comment "没有自动重置 \`dev\`：远端已经没有这个分支。"
            exit 0
          fi
          if [ "$CURRENT" != "$HEAD_SHA" ]; then
            comment "没有自动重置 \`dev\`：它现在是 \`${CURRENT:0:7}\`，不是本 PR 合并时的 \`${HEAD_SHA:0:7}\`。请先处理合并后推到 \`dev\` 的提交，再手动重置。"
            exit 0
          fi
          # The lease rejects the push if dev moves after the check above.
          if ! git push --force-with-lease="refs/heads/dev:$HEAD_SHA" origin "$MERGE_SHA:refs/heads/dev"; then
            comment "自动重置 \`dev\` 失败：推送被拒绝。请查看 [运行日志]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)，再手动重置。"
            exit 1
          fi
          echo "dev reset to $MERGE_SHA."
